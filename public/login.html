<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0c10;display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Courier New',monospace;color:#e0e0e0}
  .card{background:#111520;border:1px solid #00e5ff33;border-radius:8px;padding:40px;width:320px;text-align:center}
  .logo{font-size:2rem;letter-spacing:4px;color:#00e5ff;margin-bottom:8px}
  .sub{color:#555;font-size:0.75rem;margin-bottom:32px;letter-spacing:2px}
  input{width:100%;background:#0a0c10;border:1px solid #00e5ff44;border-radius:4px;padding:10px 14px;color:#e0e0e0;font-size:1rem;font-family:inherit;outline:none;margin-bottom:16px;transition:border .2s}
  input:focus{border-color:#00e5ff}
  button{width:100%;background:#00e5ff;border:none;border-radius:4px;padding:11px;font-size:1rem;font-weight:bold;cursor:pointer;color:#0a0c10;letter-spacing:1px;transition:opacity .2s}
  button:hover{opacity:.85}
  .err{color:#ff4444;font-size:.8rem;margin-top:12px;min-height:1.2em}
</style>
</head>
<body>
<div class="card">
  <div class="logo">ALPHA</div>
  <div class="sub">COMMAND &amp; CONTROL</div>
  <input type="password" id="tok" placeholder="Access token" autofocus />
  <button onclick="login()">ACCESS</button>
  <div class="err" id="err"></div>
</div>
<script>
async function login(){
  const tok=document.getElementById('tok').value.trim();
  if(!tok)return;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok})});
  const j=await r.json();
  if(j.ok){localStorage.setItem('alpha_token',tok);location.href='/';}
  else document.getElementById('err').textContent='Access denied.';
}
document.getElementById('tok').addEventListener('keydown',e=>e.key==='Enter'&&login());
</script>
</body>
</html>
